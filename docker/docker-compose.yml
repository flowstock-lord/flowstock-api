name: flowstock

services:
  postgres:
    image: postgres:17-alpine
    container_name: flowstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowstock}
      POSTGRES_USER: ${POSTGRES_USER:-flowstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowstock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowstock} -d ${POSTGRES_DB:-flowstock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: flowstock-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__FlowStockDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowstock};Username=${POSTGRES_USER:-flowstock};Password=${POSTGRES_PASSWORD:-flowstock}"
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    profiles:
      - full

volumes:
  postgres-data:
